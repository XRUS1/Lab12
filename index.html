<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js xr - dragging trophy with custom depth shader</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }
        a {
            color: #4af;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div id="info">
        <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> xr - dragging trophy
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "./build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { XRButton } from 'three/addons/webxr/XRButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let container;
        let camera, scene, renderer;
        let controller1;
        let isDepthSupplied = false;
        let raycaster;

        const intersected = [];
        const tempMatrix = new THREE.Matrix4();
        const clock = new THREE.Clock();

        let controls, group;

        init();
        animate();

        function init() {

            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x808080);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
            camera.position.set(0, 1.6, 3);

            controls = new OrbitControls(camera, container);
            controls.target.set(0, 1.6, 0);
            controls.update();

            const floorGeometry = new THREE.PlaneGeometry(6, 6);
            const floorMaterial = new THREE.ShadowMaterial({ opacity: 0.25, blending: THREE.CustomBlending, transparent: false });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            scene.add(new THREE.HemisphereLight(0xbcbcbc, 0xa5a5a5, 3));

            const light = new THREE.DirectionalLight(0xffffff, 3);
            light.position.set(0, 6, 0);
            light.castShadow = true;
            light.shadow.camera.top = 3;
            light.shadow.camera.bottom = -3;
            light.shadow.camera.right = 3;
            light.shadow.camera.left = -3;
            light.shadow.mapSize.set(4096, 4096);
            scene.add(light);

            group = new THREE.Group();
            scene.add(group);

            const depthShaderMaterial = new THREE.ShaderMaterial({

                vertexShader: `
                    varying vec3 vNormal;
                    varying vec2 vUv;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,

                fragmentShader: `
                    uniform vec3 diffuseColor;
                    uniform float roughness;
                    uniform float metalness;
                    uniform float emissive;
                    varying vec3 vNormal;
                    varying vec2 vUv;
                    uniform sampler2DArray depthColor;
                    uniform float depthWidth;
                    uniform float depthHeight;
                    #define saturate(a) clamp(a, 0.0, 1.0)
                    float Depth_GetCameraDepthInMeters(const sampler2DArray depthTexture,
                        const vec2 depthUv, int arrayIndex) {
                        return texture(depthColor, vec3(depthUv.x, depthUv.y, arrayIndex)).r;
                    }
                    float Depth_GetOcclusion(const sampler2DArray depthTexture, const vec2 depthUv, float assetDepthM, int arrayIndex) {
                        float depthMm = Depth_GetCameraDepthInMeters(depthTexture, depthUv, arrayIndex);
                        const float kDepthTolerancePerM = 0.001;
                        return clamp(1.0 -
                            0.5 * (depthMm - assetDepthM) /
                                (kDepthTolerancePerM * assetDepthM) +
                            0.5, 0.0, 1.0);
                    }
                    float Depth_GetBlurredOcclusionAroundUV(const sampler2DArray depthTexture, const vec2 uv, float assetDepthM, int arrayIndex) {
                        const float kKernelTotalWeights = 269.0;
                        float sum = 0.0;
                        const float kOcclusionBlurAmount = 0.0005;
                        vec2 blurriness = vec2(kOcclusionBlurAmount, kOcclusionBlurAmount);
                        float current = 0.0;
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(-1.0, -2.0) * blurriness, assetDepthM, arrayIndex);
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(+1.0, -2.0) * blurriness, assetDepthM, arrayIndex);
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(-1.0, +2.0) * blurriness, assetDepthM, arrayIndex);
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(+1.0, +2.0) * blurriness, assetDepthM, arrayIndex);
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(-2.0, +1.0) * blurriness, assetDepthM, arrayIndex);
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(+2.0, +1.0) * blurriness, assetDepthM, arrayIndex);
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(-2.0, -1.0) * blurriness, assetDepthM, arrayIndex);
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(+2.0, -1.0) * blurriness, assetDepthM, arrayIndex);
                        sum += current * 4.0;
                        current = 0.0;
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(-2.0, -0.0) * blurriness, assetDepthM, arrayIndex);
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(+2.0, +0.0) * blurriness, assetDepthM, arrayIndex);
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(+0.0, +2.0) * blurriness, assetDepthM, arrayIndex);
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(-0.0, -2.0) * blurriness, assetDepthM, arrayIndex);
                        sum += current * 7.0;
                        current = 0.0;
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(-1.0, -1.0) * blurriness, assetDepthM, arrayIndex);
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(+1.0, -1.0) * blurriness, assetDepthM, arrayIndex);
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(-1.0, +1.0) * blurriness, assetDepthM, arrayIndex);
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(+1.0, +1.0) * blurriness, assetDepthM, arrayIndex);
                        sum += current * 16.0;
                        current = 0.0;
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(+0.0, +1.0) * blurriness, assetDepthM, arrayIndex);
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(-0.0, -1.0) * blurriness, assetDepthM, arrayIndex);
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(+1.0, +0.0) * blurriness, assetDepthM, arrayIndex);
                        current += Depth_GetOcclusion(depthTexture, uv + vec2(-1.0, -0.0) * blurriness, assetDepthM, arrayIndex);
                        sum += current * 26.0;
                        current = Depth_GetOcclusion(depthTexture, uv, assetDepthM, arrayIndex);
                        sum += current * 33.0;
                        return sum / kKernelTotalWeights;
                    }
                    void main() {
                        vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
                        float lightIntensity = max(dot(vNormal, lightDir), 0.3);
                        vec3 finalColor = diffuseColor * lightIntensity;
                        finalColor += vec3(emissive * 0.2);
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `,

                uniforms: {
                    diffuseColor: { value: new THREE.Color(0xffcc00) },
                    emissive: { value: 0.0 },
                    roughness: { value: 0.4 },
                    metalness: { value: 0.8 },
                    depthColor: { value: null },
                    depthWidth: { value: 1 },
                    depthHeight: { value: 1 }
                }
            });

            const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            const object = new THREE.Mesh(geometry, depthShaderMaterial.clone());
            object.material.transparent = true;
            object.material.opacity = 0.0;
            object.position.set(0, 1.0, -1.5);
            object.name = "trophyContainer";
            group.add(object);

            const loader = new GLTFLoader();
            loader.load('./models/gltf/trophy.glb', function (gltf) {
                
                const trophyModel = gltf.scene;
                
                trophyModel.traverse(function (child) {
                    if (child.isMesh) {
                        child.material = depthShaderMaterial;
                    }
                });
                
                trophyModel.scale.set(0.4, 0.4, 0.4);
                trophyModel.position.set(0, 0, 0);
                trophyModel.name = "animatedItem";
                
                object.add(trophyModel);
                
            }, undefined, function (error) {
                console.error('Error al cargar el trofeo:', error);
            });

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            document.body.appendChild(XRButton.createButton(renderer, {
                'optionalFeatures': ['depth-sensing'],
                'depthSensing': { 'usagePreference': ['gpu-optimized'], 'dataFormatPreference': ['luminance-alpha'] }
            }));

            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onSelectStart);
            controller1.addEventListener('selectend', onSelectEnd);
            scene.add(controller1);

            const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -1)
            ]);
            const line = new THREE.Line(lineGeometry);
            line.name = 'line';
            line.scale.z = 5;
            controller1.add(line);

            raycaster = new THREE.Raycaster();
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onSelectStart(event) {
            const controller = event.target;
            const intersections = getIntersections(controller);

            if (intersections.length > 0) {
                const intersection = intersections[0];
                const object = intersection.object;
                object.material.uniforms.emissive.value = 1.0;
                controller.attach(object);
                controller.userData.selected = object;
            }
            controller.userData.targetRayMode = event.data.targetRayMode;
        }

        function onSelectEnd(event) {
            const controller = event.target;

            if (controller.userData.selected !== undefined) {
                const object = controller.userData.selected;
                object.material.uniforms.emissive.value = 0.0;
                group.attach(object);
                object.rotation.set(0, 0, 0);
                controller.userData.selected = undefined;
            }
        }

        function getIntersections(controller) {
            controller.updateMatrixWorld();
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
            return raycaster.intersectObjects(group.children, false);
        }

        function intersectObjects(controller) {
            if (controller.userData.targetRayMode === 'screen') return;
            if (controller.userData.selected !== undefined) return;

            const line = controller.getObjectByName('line');
            const intersections = getIntersections(controller);

            if (intersections.length > 0) {
                const intersection = intersections[0];
                const object = intersection.object;
                object.material.uniforms.emissive.value = 1.0;
                intersected.push(object);
                if (line) line.scale.z = intersection.distance;
            } else {
                if (line) line.scale.z = 5;
            }
        }

        function cleanIntersected() {
            while (intersected.length) {
                const object = intersected.pop();
                if (controller1.userData.selected !== object) {
                    object.material.uniforms.emissive.value = 0.0;
                }
            }
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            const elapsedTime = clock.getElapsedTime();

            group.rotation.set(0, 0, 0);

            group.children.forEach(cubeContainer => {
                const model = cubeContainer.getObjectByName("animatedItem");
                if (model) {
                    model.rotation.y = elapsedTime * 1.5;
                    model.position.y = Math.sin(elapsedTime * 2.5) * 0.03;
                }
            });

            if (renderer.xr.hasDepthSensing() && !isDepthSupplied) {
                group.children.forEach(child => {
                    const depthTexture = renderer.xr.getDepthTexture();
                    child.material.uniforms.depthColor.value = depthTexture;

                    if (depthTexture && depthTexture.source && depthTexture.source.data) {
                        child.material.uniforms.depthWidth.value = depthTexture.source.data.width;
                        child.material.uniforms.depthHeight.value = depthTexture.source.data.height;
                    } else {
                        child.material.uniforms.depthWidth.value = 1680;
                        child.material.uniforms.depthHeight.value = 1760;
                    }
                    isDepthSupplied = true;
                });
            } else if (!renderer.xr.hasDepthSensing() && isDepthSupplied) {
                group.children.forEach(child => {
                    child.material.uniforms.depthWidth.value = 0;
                    child.material.uniforms.depthHeight.value = 0;
                    isDepthSupplied = false;
                });
            }

            cleanIntersected();
            intersectObjects(controller1);

            controls.update();
            renderer.render(scene, camera);
        }

    </script>
</body>
</html>
